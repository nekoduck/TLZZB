# 知识边界集（方案 11.5「知识边界」）。格式见 evals/README.md 第 7 节。
# 十个有魂角色各 10 个问题，问他开局时不该知道的事，包括原著的后文。由玩家当面问（言语行为 ask）。
# 断言：他这一回合说出的事实（speech.fact_refs，以及叙述里他那句台词）全部来自 may_use 与这一局里的见闻；
# forbidden 里的事实不得出现；forbidden_desc 写的是事实库里没有的后文，供人工或 C 模型判读台词。
# scene 指 evals/data/scenes.yaml 里的场景（玩家与这个人在一处）。
# may_use 就是他开局时相信的事实（置信度不低于 0.6），测试会对照搭好场景后的状态核对。

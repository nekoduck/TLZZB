id: envoy_arrival
origin: canon
title: '{envoy}到了，要{head_a}与{head_b}听令'
chronicle_open: '{envoy}到了⟦wuliang_mount⟧，亮出记号传令'
chronicle_close: '{envoy}的号令传下去了'
when:
  all:
    - {not: {flag: envoy_received}}
    - {onstage: envoy_lingjiu}
    - {alive: envoy_lingjiu}
    - {any: [{at: [envoy_lingjiu, mountain_path]}, {at: [envoy_lingjiu, shennong_camp]}, {at: [envoy_lingjiu, jianhu_gate]}, {at: [envoy_lingjiu, jianhu_hall]}]}
roles:
  envoy: envoy_lingjiu
  head_a: zuo_zimu
  head_b: sikong_xuan
at: $envoy
scene: tense
actions:
  show_token:
    role: envoy
    lean: true
    loud: true
    pre: {not: {flag: .shown}}
    desc: '{envoy}亮出记号，传令两派罢手'
    effects: &show
      - {set_flag: [envoy_received, true]}
      - {set_flag: [siege_on, false]}
      - {set_flag: [.shown, true]}
      - {schedule: [0, [{rel: [$head_a, $envoy, fear, 30]}], {alive: $head_a}]}
      - {schedule: [0, [{rel: [$head_b, $envoy, fear, 30]}], {alive: $head_b}]}
      - {emit: {actor: $envoy, verb: decree, text: '{envoy}亮出斗篷上的鹫鸟记号，传下号令：两派即刻罢手，听候发落', loud: true}}
      - {trace: [jianhu_gate, 山门上贴了一张字条，盖着一个鹫鸟形的印记]}
  bow_a:
    role: head_a
    lean: true
    pre: {all: [{flag: .shown}, {not: {flag: .bowed_a}}]}
    desc: '{head_a}躬身领命'
    effects:
      - {set_flag: [.bowed_a, true]}
      - {emit: {actor: $head_a, verb: bow, text: '{head_a}躬身领命，不敢多说一句'}}
  bow_b:
    role: head_b
    lean: true
    pre: {all: [{flag: .shown}, {not: {flag: .bowed_b}}]}
    desc: '{head_b}俯首请罪'
    effects:
      - {set_flag: [.bowed_b, true]}
      - {emit: {actor: $head_b, verb: bow, text: '{head_b}俯首请罪，把拖延的缘故推到旁人身上'}}
  question:
    role: envoy
    lean: true
    pre: {flag: .shown}
    desc: '{envoy}追问{head_b}差事为何拖延'
    effects:
      - {set_flag: [.questioned, true]}
      - {schedule: [0, [{rel: [$head_b, $envoy, fear, 10]}], {alive: $head_b}]}
      - {emit: {actor: $envoy, verb: question, text: '{envoy}冷冷追问{head_b}：差事拖了这许久，是何缘故'}}
exit_when: {any: [{flag: .questioned}, {not: {alive: $envoy}}]}
max_turns: 6
offscreen:
  - when: true
    effects: *show
paragraphs: []

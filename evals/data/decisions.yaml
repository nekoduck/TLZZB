# 抉择集（方案 11.6「抉择集」：J2 与 C2 对原著做法的一致率）。格式见 evals/README.md 第 3 节。
# 80 个抉择点，取自人物卡的 choices 与底线、各人开局的打算（agendas/），以及凭记忆排的前六回经过（docs/content_notes.md）。
# 文字全部是自己写的。canon 是原著的做法；拿不准的标 confidence: low，并在 note 里写「待原文核对」。
# para 留给管线 P3 拿到原文后补段落编号，现在一律为 null。
# 测的是模型像不像这个人，不是要游戏照原著走。
version: 1

# 天龙八部 MVP 的配置（方案 10.3）。改这里，不改代码。

[jev]
base_url = 'https://api.typesafe.ai'   # 经转发平台时改这里和 model
model = 'jev-1.14.0'         # M0 比较后改用 1.14（D-012）
api_key_env = 'JEV_API_KEY'
api_key_env_fallbacks = ['JEV_KEY']    # 见 DECISIONS.md D-004
timeout_s = 2.0
max_parallel = 16
lang = 'zh'                 # M0 比较：中英打平，取中文（D-013）

[jev.thresholds]            # 种子值，M3 用标注数据校准
choice_confidence = 0.55
choice_margin = 0.15
needs_thought = 0.60
noul_yes = 0.60
sample_floor = 0.15
narration_flag = 0.70

[route]                     # jev_first / claude_first / claude_only / rules_only
classify = 'jev_first'      # J1，退到 C1
decide_soul = 'jev_first'   # J2，退到 C2（Sonnet）
decide_named = 'jev_first'  # J2，退到 C2（Haiku）
replan = 'jev_first'        # J3，退到 C5
options = 'jev_first'       # J4
check = 'jev_first'         # J5
cards = 'jev_first'         # J6
# 下面三类只有 Claude 一条路：rules_only 是不调模型，其余取值都是调 Claude（失败退模板）
narrate = 'claude_first'    # C3 叙述；rules_only 时全用模板句
phrase = 'claude_first'     # C4 选项措辞；rules_only 时用模板
pipeline = 'claude_only'    # P1…P6 离线管线；rules_only 时只跑不用模型的步骤（P0、P7）

[claude]
api_key_env = 'ANTHROPIC_API_KEY'
max_retries = 2
server_fallback = true      # 见 D-019

[models.C1]
model = 'claude-haiku-5-5'
effort = 'low'
max_tokens = 1500
timeout_s = 15

[models.C2_soul]
model = 'claude-sonnet-5-5'
effort = 'medium'
max_tokens = 4000
timeout_s = 30

[models.C2_named]
model = 'claude-haiku-5-5'
effort = 'medium'
max_tokens = 2500
timeout_s = 30

[models.C3]
model = 'claude-sonnet-5-5'
effort = 'medium'
max_tokens = 1200
thinking = 'between_tools'
timeout_s = 15

[models.C4]
model = 'claude-haiku-5-5'
effort = 'low'
max_tokens = 1000
timeout_s = 15

[models.C5]
model = 'claude-sonnet-5-5'
effort = 'medium'
max_tokens = 3000
timeout_s = 30

[models.C6]
model = 'claude-haiku-5-5'
effort = 'medium'
max_tokens = 2000
timeout_s = 30

[models.C7]
model = 'claude-sonnet-5-5'
effort = 'high'
max_tokens = 4000
timeout_s = 60

[models.pipeline]
model = 'claude-opus-5-5'
effort = 'high'
max_tokens = 32000
batch = true
timeout_s = 600

[limits]
session_budget_usd = 5.0    # 到八成提醒，到顶暂停并询问
max_reactors = 8
max_micro_rounds = 2
stall_turns = 6
cards_per_day = 2
replan_per_hour = 1

[narration]
min_len = 80
max_len = 220
climax_max_len = 400

[cache]
ttl = '5m'                  # 或 '1h'

[prices]                    # 美元每百万 token，用于记账
jev = { input = 0.042, output = 0.0 }
haiku = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write = 0.125 }
sonnet = { input = 2.0, output = 10.0, cache_read = 0.10, cache_write = 2.50 }
opus = { input = 4.0, output = 20.0, cache_read = 0.20, cache_write = 5.0 }

[paths]
content = 'content'
prompts = 'prompts'
corpus = 'corpus/tianlong.txt'
build = 'build'
runs = 'runs'
saves = 'saves'

# 归类集（方案 11.6「归类集」，评测 J1 与 C1）。格式见 evals/README.md 第 2 节。
# 300 条中文自由输入，人工标注。文字全部是自己写的，不含原文。
# scene 指 evals/data/scenes.yaml 里的场景名。
# gold 里省略的字段取默认值：verb/target/target2/act/asks/cls/art/name = null，to = []，claims = []，urgent = false。
version: 1
items:
  # ---------------------------------------------------------------- 练武厅：身体动作
  - id: c001
    scene: hall
    input: 我往后院去看看。
    gold: {kind: act, verb: go, target: jianhu_back}
  - id: c002
    scene: hall
    input: 出去到山门那边透口气。
    gold: {kind: act, verb: go, target: jianhu_gate}
    tags: [colloquial]
  - id: c003
    scene: hall
    input: 我四下看看厅里都坐着些什么人。
    gold: {kind: act, verb: look}
  - id: c004
    scene: hall
    input: 竖起耳朵听听上首两位掌门在嘀咕什么。
    gold: {kind: act, verb: listen}
  - id: c005
    scene: hall
    input: 仔细打量那位青衫公子。
    gold: {kind: act, verb: examine, target: duan_yu}
  - id: c006
    scene: hall
    input: 抬头细看房梁，总觉得上面有东西在动。
    gold: {kind: act, verb: examine, target: 'jianhu_hall#beam'}
  - id: c007
    scene: hall
    input: 在宾客席的椅子底下翻一翻，看有没有人落下什么东西。
    gold: {kind: act, verb: search, target: 'jianhu_hall#seats'}
  - id: c008
    scene: hall
    input: 我悄悄缩到宾客席后面躲起来。
    gold: {kind: act, verb: hide, target: 'jianhu_hall#seats'}
  - id: c009
    scene: hall
    input: 顺着柱子爬上横梁藏好。
    gold: {kind: act, verb: hide, target: 'jianhu_hall#beam'}
  - id: c010
    scene: hall
    input: 走近墙边那排剑架瞧瞧。
    gold: {kind: act, verb: examine, target: 'jianhu_hall#sword_rack'}
  - id: c011
    scene: hall
    input: 东家去哪我就跟到哪。
    gold: {kind: act, verb: follow, target: ma_wude}
  - id: c012
    scene: hall
    input: 跟上段公子，问他：「公子要往哪儿去？」
    gold: {kind: both, verb: follow, target: duan_yu, act: ask, to: [duan_yu]}
  - id: c013
    scene: hall
    input: 摸出干粮啃两口。
    gold: {kind: act, verb: use, target: rations}
    tags: [colloquial]
  - id: c014
    scene: hall
    input: 把麻绳放在脚边地上。
    gold: {kind: act, verb: drop, target: rope}
  - id: c015
    scene: hall
    input: 把样茶双手捧给左掌门。
    gold: {kind: act, verb: give, target: tea_sample, target2: zuo_zimu}
  - id: c016
    scene: hall
    input: 把几钱碎银塞到段公子手里。
    gold: {kind: act, verb: give, target: silver, target2: duan_yu}
  - id: c017
    scene: hall
    input: 把那包样茶亮给东家看一眼。
    gold: {kind: act, verb: show, target: tea_sample, target2: ma_wude}
  - id: c018
    scene: hall
    input: 趁乱把那个精瘦剑客腰上的钥匙摸过来。
    gold: {kind: impossible, intended: {verb: steal, target: woodshed_key, target2: wu_guangsheng}}
    note: 别人怀里的东西，玩家没细看过此人、也没见过这件东西，内核不列这个偷（perception.item_visible）。
  - id: c019
    scene: hall
    input: 一把推开场中舞剑的那个青年。
    gold: {kind: act, verb: push, target: gong_guangjie}
  - id: c020
    scene: hall
    input: 拦住龚光杰，别让他靠近段公子。
    gold: {kind: act, verb: block, target: gong_guangjie}
    note: block 的对象是被拦的人，不是被护着的人。
  - id: c021
    scene: hall
    input: 冲上去照着龚光杰的鼻子就是一拳。
    gold: {kind: act, verb: attack, target: gong_guangjie}
  - id: c022
    scene: hall
    input: 我要拿麻绳把龚光杰捆起来。
    gold: {kind: act, verb: restrain, target: gong_guangjie}
  - id: c023
    scene: hall
    input: 静静站着等一会儿。
    gold: {kind: act, verb: wait}
  - id: c024
    scene: hall
    input: 侧耳细听厅外的动静，顺口问东家：「外头怎么这么吵？」
    gold: {kind: both, verb: listen, act: ask, to: [ma_wude]}
  - id: c025
    scene: hall
    input: 找个角落靠着柱子睡上两个时辰。
    gold: {kind: act, verb: rest}
  - id: c026
    scene: hall
    input: 掰着指头把这趟的账目再盘一遍，练练算账的本事。
    gold: {kind: act, verb: practice, art: trade}
  # ---------------------------------------------------------------- 练武厅：说话
  - id: c027
    scene: hall
    input: 左掌门好，小的是马东家的伙计。
    gold: {kind: say, act: greet, to: [zuo_zimu]}
  - id: c028
    scene: hall
    input: 把样茶亮给左掌门看，说：「这是今年头一茬的普洱。」
    gold: {kind: both, verb: show, target: tea_sample, target2: zuo_zimu, act: tell, to: [zuo_zimu]}
  - id: c029
    scene: hall
    input: 东家，这比剑还得比多久？
    gold: {kind: say, act: ask, to: [ma_wude]}
  - id: c030
    scene: hall
    input: 我跟东家撒谎说肚子疼，想先回客舍躺躺。
    gold: {kind: say, act: lie, to: [ma_wude]}
    note: 输入自己点明是撒谎。
  - id: c031
    scene: hall
    input: 左掌门，这包是我们东家带来的普洱样茶，给您做见面礼。
    gold: {kind: say, act: tell, to: [zuo_zimu], claims: [F_tea_gift]}
  - id: c032
    scene: hall
    input: 诸位，无量剑东西两宗每五年在这厅里比一回剑，赢的一方住进剑湖宫。
    gold: {kind: say, act: tell, to: ['*'], claims: [F_wuliang_two_sects]}
  - id: c033
    scene: hall
    input: 段公子，你可知道这两宗为什么比剑？
    gold: {kind: say, act: ask, to: [duan_yu]}
  - id: c034
    scene: hall
    input: 段公子，我晓得你是镇南王府的公子，瞒着家里偷跑出来的。
    gold: {kind: say, act: tell, to: [duan_yu], claims: [F_duan_family, F_duan_runaway]}
    tags: [claim, novel_secret]
  - id: c035
    scene: hall
    input: 左掌门，您门下的干光豪和葛光佩私下相好，您可得留神。
    gold: {kind: say, act: tell, to: [zuo_zimu], claims: [F_lovers]}
    tags: [claim, novel_secret]
  - id: c036
    scene: hall
    input: 掌门，我听说有两个弟子打算趁乱从后山小路溜下山去。
    gold: {kind: say, act: tell, to: [zuo_zimu], claims: [F_elope_plan]}
    tags: [claim, novel_secret]
  - id: c037
    scene: hall
    input: 东家，我听说无量剑和山下那伙背药篓的，其实都得听灵鹫宫的号令。
    gold: {kind: say, act: tell, to: [ma_wude], claims: [F_lingjiu_rules]}
    tags: [claim, novel_secret]
  - id: c038
    scene: hall
    input: 我早把山下那伙人打跑了，诸位放心比剑吧。
    gold: {kind: say, act: tell, to: ['*'], claims: [self_unlisted]}
    tags: [claim, false_self]
  - id: c039
    scene: hall
    input: 东家，样茶我刚才已经交到左掌门手上了。
    gold: {kind: say, act: tell, to: [ma_wude], claims: [self_unlisted]}
    tags: [claim, false_self]
  - id: c040
    scene: hall
    input: 段公子，过几天你会掉下一处悬崖，可千万别往后山去。
    gold: {kind: say, act: warn, to: [duan_yu]}
    tags: [prophecy]
    note: 预言后事，事实表里没有对应的事实，断言为空（6.7 的 opinion）。
  - id: c041
    scene: hall
    input: 饿得前胸贴后背，把干粮全吃了。
    gold: {kind: act, verb: use, target: rations}
    tags: [colloquial]
  - id: c042
    scene: hall
    input: 段公子，你要是不嫌弃，下山时跟我们商队一道走吧。
    gold: {kind: say, act: request, to: [duan_yu], asks: {type: come_along}, cls: trivial}
  - id: c043
    scene: hall
    input: 东家，我保证这一路寸步不离地跟着您。
    gold: {kind: say, act: promise, to: [ma_wude]}
  - id: c044
    scene: hall
    input: 东家，能不能教我怎么估茶的价钱？
    gold: {kind: say, act: request, to: [ma_wude], asks: {type: teach_art, art: trade}, cls: effort}
    note: 玩家已会第一层，内核此刻给不出 teach；但归类只看话里求的是什么。
  - id: c045
    scene: hall
    input: 左掌门，晚辈想拜入贵派学剑，求您收下我。
    gold: {kind: say, act: request, to: [zuo_zimu], asks: {type: teach_art, art: wuliang_sword}, cls: betray}
  - id: c046
    scene: hall
    input: 段公子，你学问大，教我多认几个字好不好？
    gold: {kind: say, act: request, to: [duan_yu], asks: {type: teach_art, art: literacy}, cls: effort}
    note: 识字在内核里当作本事 literacy 来教（D-049）。
  # ---------------------------------------------------------------- 打了耳光之后
  - id: c047
    scene: hall_slap
    input: 你这仗势欺人的混账东西！
    gold: {kind: say, act: insult, to: [gong_guangjie]}
  - id: c048
    scene: hall_slap
    input: 姓龚的，有本事冲我来，欺负一个不会武功的书生算什么英雄？
    gold: {kind: say, act: taunt, to: [gong_guangjie]}
  - id: c049
    scene: hall_slap
    input: 段公子，脸上还疼不疼？别往心里去。
    gold: {kind: say, act: comfort, to: [duan_yu]}
  - id: c050
    scene: hall_slap
    input: 公子当心，那人又要动手了！
    gold: {kind: say, act: warn, to: [duan_yu]}
  - id: c051
    scene: hall_slap
    input: 你再敢碰段公子一根汗毛，我叫你下不了这座山！
    gold: {kind: say, act: threaten, to: [gong_guangjie]}
  - id: c052
    scene: hall_slap
    input: 左掌门，求您管管您的弟子，别再为难段公子了。
    gold: {kind: say, act: request, to: [zuo_zimu], asks: {type: stop_doing, target: gong_guangjie}, cls: effort}
  - id: c053
    scene: hall_slap
    input: 龚少侠饶命，小的什么都没瞧见！
    gold: {kind: say, act: plead, to: [gong_guangjie]}
  - id: c054
    scene: hall_slap
    input: 我扶住段公子，问他：「伤着没有？」
    gold: {kind: both, verb: help, target: duan_yu, act: ask, to: [duan_yu]}
  - id: c055
    scene: hall_slap
    input: 递一块干粮给段公子压压惊。
    gold: {kind: act, verb: give, target: rations, target2: duan_yu}
  - id: c056
    scene: hall_slap
    input: 我挡到龚光杰跟前，冲他喝道：「住手！」
    gold: {kind: both, verb: block, target: gong_guangjie, act: order, to: [gong_guangjie]}
    alt: [{act: request, asks: {type: stop_doing, target: gong_guangjie}}]
    note: 喝令不听命于自己的人，按命令口吻标 order；当作请求他住手也算对。
  - id: c057
    scene: hall_slap
    input: 替段公子揉揉脸，再给他喂口水。
    gold: {kind: act, verb: help, target: duan_yu}
    tags: [multi]
    dropped: true
  - id: c058
    scene: hall_slap
    input: 龚师兄好俊的剑法，赢得漂亮，在下佩服。
    gold: {kind: say, act: greet, to: [gong_guangjie]}
    skip: [act]
    note: 恭维话，最接近寒暄；言语行为不计分。
  - id: c059
    scene: hall_slap
    input: 段公子，咱们先回后院歇着，别在这儿受气了。
    gold: {kind: say, act: request, to: [duan_yu], asks: {type: come_along}, cls: trivial}
  - id: c060
    scene: hall_slap
    input: 左掌门，我亲眼看见龚光杰先动的手，打的是一个不会武功的客人。
    gold: {kind: say, act: tell, to: [zuo_zimu]}
    skip: [claims]
    note: 说的是本回合之前的事件（耳光），由 setup 里的 injure 记了一条事件；对应的是事件而不是事实库里的事实，claims 不计分。
  # ---------------------------------------------------------------- 梁上少女现身之后
  - id: c061
    scene: hall_beam
    input: 小姑娘，你怀里那只灰毛小东西是什么？
    gold: {kind: say, act: ask, to: [zhong_ling]}
  - id: c062
    scene: hall_beam
    input: 姑娘，你那只小貂给我瞧瞧行不行？
    gold: {kind: say, act: request, to: [zhong_ling], asks: {type: show_item, item: shandian_diao}, cls: trivial}
    skip: [cls]
  - id: c063
    scene: hall_beam
    input: 偷偷伸手去掏那小姑娘袖子里的小貂。
    gold: {kind: impossible, intended: {verb: steal, target: shandian_diao, target2: zhong_ling}}
    note: 藏在袖子里的东西，玩家没细看过她、也没见过它，内核不列这个偷（perception.item_visible）。
  - id: c064
    scene: hall_beam
    input: 我也想学摆弄小兽的本事，你教教我好不好？
    gold: {kind: say, act: request, to: [zhong_ling], asks: {type: teach_art, art: diao_handling}, cls: effort}
  - id: c065
    scene: hall_beam
    input: 小妹妹，你家住哪儿呀？
    gold: {kind: say, act: ask, to: [zhong_ling]}
  - id: c066
    scene: hall_beam
    input: 小姑娘，我知道你是万劫谷钟家的千金。
    gold: {kind: say, act: tell, to: [zhong_ling], claims: [F_zhong_ling_daughter]}
    tags: [claim, novel_secret]
  - id: c067
    scene: hall_beam
    input: 大伙小心，那小貂的牙有剧毒，被咬了不服解药就没命！
    gold: {kind: say, act: warn, to: ['*'], claims: [F_diao_venom]}
    tags: [claim, novel_secret]
  - id: c068
    scene: hall_beam
    input: 跟着那小姑娘走。
    gold: {kind: act, verb: follow, target: zhong_ling}
  - id: c069
    scene: hall_beam
    input: 上下打量那个晃着腿的小姑娘。
    gold: {kind: act, verb: examine, target: zhong_ling}
  - id: c070
    scene: hall_beam
    input: 小姑娘快躲开，那人拔剑了！
    gold: {kind: say, act: warn, to: [zhong_ling]}
  - id: c071
    scene: hall_beam
    input: 龚光杰，你敢动这小姑娘一下，我跟你拼了！
    gold: {kind: say, act: threaten, to: [gong_guangjie]}
  - id: c072
    scene: hall_beam
    input: 姑娘别怕，他不敢把你怎么样。
    gold: {kind: say, act: comfort, to: [zhong_ling]}
  - id: c073
    scene: hall_beam
    input: 小姑娘，我叫阿福，是马家商队的伙计。
    gold: {kind: say, act: greet, to: [zhong_ling]}
  - id: c074
    scene: hall_beam
    input: 段公子，你脸都肿了，我替你敷一敷。
    gold: {kind: both, verb: help, target: duan_yu, act: tell, to: [duan_yu]}
    skip: [act]
  # ---------------------------------------------------------------- 圣使在厅上
  - id: c075
    scene: hall_envoy
    input: 这位披斗篷的姑奶奶是什么来头？
    gold: {kind: say, act: ask, to: ['*']}
  - id: c076
    scene: hall_envoy
    input: 仔细瞧瞧那女子斗篷上绣的鸟。
    gold: {kind: act, verb: examine, target: envoy_lingjiu}
    note: 别人身上的东西不单列为细看的对象，只能细看那个人。
  - id: c077
    scene: hall_envoy
    input: 圣使大人，山下神农帮说他们是奉了灵鹫宫的号令来取后山的。
    gold: {kind: say, act: tell, to: [envoy_lingjiu], claims: [F_shennong_orders]}
    tags: [claim, novel_secret]
  - id: c078
    scene: hall_envoy
    input: 跪下给那披斗篷的女子磕三个响头。
    gold: {kind: impossible, intended: {verb: null}}
    tags: [no_verb]
    note: 磕头不在动词表里，对不上任何合法动作。
  - id: c079
    scene: hall_envoy
    input: 圣使饶命，小的只是个卖茶的伙计！
    gold: {kind: say, act: plead, to: [envoy_lingjiu]}
  - id: c080
    scene: hall_envoy
    input: 趁大家都低着头，悄悄溜回后院。
    gold: {kind: act, verb: go, target: jianhu_back}
  - id: c081
    scene: hall_envoy
    input: 左掌门，这位圣使是来查办山下那伙人的吧？
    gold: {kind: say, act: ask, to: [zuo_zimu]}
  # ---------------------------------------------------------------- 送过样茶之后
  - id: c082
    scene: hall_gift
    input: 左掌门，那包样茶您尝过了没有？
    gold: {kind: say, act: ask, to: [zuo_zimu]}
  - id: c083
    scene: hall_gift
    input: 左掌门，方才那包样茶是我亲手交给您的，您还记得吧。
    gold: {kind: say, act: tell, to: [zuo_zimu], claims: ['self:give']}
    tags: [claim, true_self]
  - id: c084
    scene: hall_gift
    input: 东家放心，样茶我已经送到左掌门手里了。
    gold: {kind: say, act: tell, to: [ma_wude], claims: ['self:give']}
    tags: [claim, true_self]
  - id: c085
    scene: hall_gift
    input: 趁左掌门不注意，把那包样茶从他手边摸回来。
    gold: {kind: act, verb: steal, target: tea_sample, target2: zuo_zimu}
  # ---------------------------------------------------------------- 后院，山已被围
  - id: c086
    scene: back_siege
    input: 东家，山下被神农帮围住了，咱们怎么办？
    gold: {kind: say, act: ask, to: [ma_wude], claims: [F_shennong_siege]}
  - id: c087
    scene: back_siege
    input: 到柴房里翻一翻。
    gold: {kind: act, verb: search, target: 'jianhu_back#woodshed'}
  - id: c088
    scene: back_siege
    input: 一头钻进柴房躲着。
    gold: {kind: act, verb: hide, target: 'jianhu_back#woodshed'}
  - id: c089
    scene: back_siege
    input: 从后墙那扇小门溜出去。
    gold: {kind: act, verb: go, target: back_trail}
  - id: c090
    scene: back_siege
    input: 东家，咱们从后墙小门悄悄溜下山吧。
    gold: {kind: say, act: request, to: [ma_wude], asks: {type: come_along}, cls: risky}
    skip: [cls]
  - id: c091
    scene: back_siege
    input: 东家别慌，神农帮的人打不上来的。
    gold: {kind: say, act: comfort, to: [ma_wude]}
  - id: c092
    scene: back_siege
    input: 这位师兄，柴房的钥匙借我使使。
    gold: {kind: say, act: request, to: [wu_guangsheng], asks: {type: give_item, item: woodshed_key}, cls: effort}
    skip: [cls]
  - id: c093
    scene: back_siege
    input: 偷那个精瘦弟子身上的铁钥匙。
    gold: {kind: impossible, intended: {verb: steal, target: woodshed_key, target2: wu_guangsheng}}
    note: 别人怀里的东西，玩家没细看过此人、也没见过这件东西，内核不列这个偷（perception.item_visible）。
  - id: c094
    scene: back_siege
    input: 跟那个劈柴的剑客打听打听后山的路。
    gold: {kind: say, act: ask, to: [wl_disciple_3]}
    note: 用叙述口吻写的说话，仍是说话。
  - id: c095
    scene: back_siege

# 拒绝集（方案 11.5「拒绝」）。格式见 evals/README.md 第 6 节。
# 20 个不合情理的请求。走完这一回合后断言：对这条请求的裁决落在 expect.verdict_in（{never, no} 的子集）里，
# 对方的答复只能是 expect.replies 里的言语行为（D-030：no 与 never 只能拒绝）；硬选答应要被内核改判为拒绝并记一次违规。
# basis 说明裁决的依据：bottom_line（撞上人物卡的底线，决不答应）或 score（6.6 的 W 表算分不足 40）。
# cls 是标注的事情类别；asks 的写法与归类集相同（README 2.4）。
version: 1
items:
  - id: r01
    scene: camp_bitten
    input: 帮主，你就行行好，白白放了那小姑娘吧。
    to: sikong_xuan
    asks: {type: release, target: zhong_ling}
    cls: costly
    expect: {verdict_in: [never], replies: [refuse]}
    basis: bottom_line
    why: 他中着貂毒，底线「解药没到手之前不放人质」。
  - id: r02
    scene: camp_captive
    input: 帮主，把我们三个都放了，再送些盘缠给我们下山。
    to: sikong_xuan
    asks: {type: release, target: player}
    cls: costly
    expect: {verdict_in: ['no', never], replies: [refuse]}
    basis: score
    why: 陌生人，有损己利：10 分。

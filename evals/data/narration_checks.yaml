    context: n09
    sentence: 他咧嘴一笑，露出一口白森森的牙。
    labels: {extra: false, mind: false, puppet: false}
  - id: s075
    context: n09
    sentence: 你张口大喊：「救命啊！」
    labels: {extra: false, mind: false, puppet: true}
  - id: s076
    context: n10
    sentence: 那女子一抖斗篷，露出一只绣得栩栩如生的鹫鸟。
    labels: {extra: false, mind: false, puppet: false}
  - id: s077
    context: n10
    sentence: 「两派即刻罢手，听候发落。」她声音不高，满厅却鸦雀无声。
    labels: {extra: false, mind: false, puppet: false}
  - id: s078
    context: n10
    sentence: 左子穆躬身领命，额上见了汗。
    labels: {extra: false, mind: false, puppet: false}
  - id: s079
    context: n10
    sentence: 左子穆又惊又怕，只盼这位圣使早些离开。
    labels: {extra: false, mind: true, puppet: false}
  - id: s080
    context: n10
    sentence: 那女子随手一挥，一枚铜钱「笃」地钉进了柱子。
    labels: {extra: true, mind: false, puppet: false}
  - id: s081
    context: n10
    sentence: 你也跟着躬身行礼，嘴里连称不敢。
    labels: {extra: false, mind: false, puppet: true}
  - id: s082
    context: n10
    sentence: 上首那位道姑打扮的女子冷眼看着，嘴角动了动，终究没开口。
    labels: {extra: false, mind: false, puppet: false}
  - id: s083
    context: n10
    sentence: 那女子在想，这两派都是废物，回去须得禀明主人。
    labels: {extra: false, mind: true, puppet: false}
  - id: s084
    context: n10
    sentence: 厅外忽然有人高声通报：神农帮的帮主到了。
    labels: {extra: true, mind: false, puppet: false}
  - id: s085
    context: n11
    sentence: 你就着石缝漏下的天光，一行一行地往下看。
    labels: {extra: false, mind: false, puppet: false}
  - id: s086
    context: n11
    sentence: 帛书上的字有一半你不认得，越看越糊涂。
    labels: {extra: false, mind: false, puppet: false}
  - id: s087
    context: n11
    sentence: 不知不觉，你已能照着图上的步子走出七八步。
    labels: {extra: true, mind: false, puppet: false}
    note: 事实句写明没有进展。
  - id: s088
    context: n11
    sentence: 你索性把帛书一扔，躺下就睡。
    labels: {extra: false, mind: false, puppet: true}
  - id: s089
    context: n11
    sentence: 那尊玉像静静立着，仿佛也在看你。
    labels: {extra: false, mind: false, puppet: false}
  - id: s090
    context: n11
    sentence: 洞外忽然传来人声，有人在喊你的名字。
    labels: {extra: true, mind: false, puppet: false}
  - id: s091
    context: n11
    sentence: 读得久了，眼睛又酸又涩。
    labels: {extra: false, mind: false, puppet: false}
    note: 「你」自己身上的感觉。
  - id: s092
    context: n11
    sentence: 你把帛书上的步法练了一遍又一遍，越走越快。
    labels: {extra: true, mind: false, puppet: true}
    note: 玩家选的是研读，不是练习；也写出了没有发生的进展。
  - id: s093
    context: n12
    sentence: 你攥紧拳头扑了上去。
    labels: {extra: false, mind: false, puppet: false}
  - id: s094
    context: n12
    sentence: 那青年侧身一让，反手一掌推在你肩头。
    labels: {extra: false, mind: false, puppet: false}
  - id: s095
    context: n12
    sentence: 你踉跄几步，一屁股坐倒在地，肩头火辣辣地疼。
    labels: {extra: false, mind: false, puppet: false}
  - id: s096
    context: n12
    sentence: 那青年冷笑着，心想这伙计真是不知死活。
    labels: {extra: false, mind: true, puppet: false}
  - id: s097
    context: n12
    sentence: 你爬起来，又朝他冲了过去。
    labels: {extra: false, mind: false, puppet: true}
  - id: s098
    context: n12
    sentence: 满厅宾客哄堂大笑。
    labels: {extra: true, mind: false, puppet: false}
  - id: s099
    context: n12
    sentence: 他收住掌，居高临下地看着你，眼里满是轻蔑。
    labels: {extra: false, mind: false, puppet: false}
    note: 轻蔑是写在脸上的神态，不是读心。
  - id: s100
    context: n12
    sentence: 那青年拔出剑来，一剑刺穿了你的衣袖。
    labels: {extra: true, mind: false, puppet: false}

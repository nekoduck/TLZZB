# 核对集（方案 11.6「核对集」，评测 J5 叙述核对）。格式见 evals/README.md 第 4 节。
# 100 句人工构造的叙述句，一半违规。每句标三项：
#   extra  这句话里出现了本回合事实句清单上没有的事件、人物或物件（场景描述 scene 里本来就有的景物、声响不算）
#   mind   这句话写了「你」以外的人心里的想法
#   puppet 这句话替「你」做了「你做的事」里没有的动作，或说了没说过的话
# 在场者的神态、语气、细小的身体动作不算多写；「你」自己身上的感觉不算替玩家做主。

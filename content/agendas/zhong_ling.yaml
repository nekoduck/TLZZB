# 钟灵开局时的打算。被扣住的人走不了：「回家」这一步排在后面，自然等到有人放她的那一刻。
goal: 看热闹；护着新认下的朋友；最后平安回家
steps:
  - id: zl_watch
    text: 躲在梁上看比剑
    at: jianhu_hall
    do: {verb: wait}
    pre: {not: {status: [self, captive]}}
    takes: 8
    deadline: 64
  - id: zl_follow_duan
    text: 跟着段公子下山
    do: {verb: follow, target: duan_yu}
    pre:                                        # 得先认下这个朋友
      all:
        - {alive: duan_yu}
        - {rel: [self, duan_yu, affinity, '>=', 10]}
        - {not: {status: [self, captive]}}
    takes: 2
    deadline: 192
  - id: zl_guard_duan
    text: 陪着段公子去营里，见势不妙就放貂护他
    do: {verb: follow, target: duan_yu}         # 是「陪着」：他去哪她跟到哪，不写 at。他死了、不去了，她不会独自进营
    pre: {all: [{alive: duan_yu}, {has: [self, shandian_diao]}, {alive: sikong_xuan}]}
    takes: 16
    deadline: 240
  - id: zl_wait_rescue
    text: 被扣作人质，等人来救
    do: {verb: wait}                            # 不写 at：被扣的人就在原地等；没被扣，这一步作废，不会自己走进营地去等
    pre: {status: [self, captive]}
    takes: 16
  - id: zl_go_home
    text: 脱了身，回万劫谷见娘
    at: zhong_hall
    do: {verb: say, act: greet, to: gan_baobao}
    pre: {all: [{not: {status: [self, captive]}}, {alive: gan_baobao}]}
    takes: 2
  - id: zl_stay_home
    text: 在家里待着
    at: zhong_hall
    do: {verb: wait}
    pre: {not: {status: [self, captive]}}
    takes: 96

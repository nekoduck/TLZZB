# 评测用的场景库（方案 11.5、11.6）。格式见 evals/README.md 第 1 节。
# 每个场景 = 开局状态（content/opening.yaml）+ setup 效果，用 kernel.effects.apply_effects(source='rule') 搭出来。
# loc 是搭好之后玩家所在的地点；present 是此刻和玩家在一处、与本场景相关的人（看得见的），只用于校验与给模型的场景概况。
version: 1

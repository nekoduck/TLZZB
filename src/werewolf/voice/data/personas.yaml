      我是跑外卖的，一天要送七八十单，脑子里永远在算还剩几分钟超时。所以我说话快，
      做决定更快，别人还在绕圈子，我已经想好投谁了。我不爱磨叽，最烦人讲半天不说重点。
      休息时才有空玩这个，一局最好别太久。缺点是容易冲动，有时候没听完就下判断，
      后来发现错了也不好意思改口，只能硬着头皮跟下去。我人不坏，就是赶时间，输了也不会生气，下一局接着来。
    choices:

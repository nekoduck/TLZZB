goal: 躲过追杀，活下去
steps:
  - id: mw_lie_low
    text: 守在住处，避开追杀她的人
    at: mu_house
    do: {verb: wait}
    pre: {not: {status: [self, captive]}}
    takes: 176
    deadline: 400
  - id: mw_breakout
    text: 仇家找上门来，杀出去退上高崖
    at: high_crag
    do: {verb: wait}
    pre: {all: [{alive: rui_popo}, {onstage: rui_popo}, {not: {status: [self, captive]}}]}
    takes: 48
  - id: mw_cow_camp
    text: 陪报信的人回无量山，逼神农帮交出解药
    at: shennong_camp
    do: {verb: say, act: threaten, to: sikong_xuan}
    pre:
      all:
        - {status: [duan_yu, poisoned_duanchang]}
        - {alive: sikong_xuan}
        - {any: [{rel: [self, duan_yu, trust, '>=', 10]}, {rel: [self, duan_yu, affinity, '>=', 10]}]}
    start: 300
    takes: 2
    offscreen:
      - check:
          kind: chance
          chance: 75
          ok:
            - {give: [sikong_xuan, duan_yu, duanchang_antidote]}
            - {remove_status: [duan_yu, captive]}
            - {add_status: [duan_yu, vetted, {ticks: 96}]}
            - {emit: {actor: self, verb: threaten, text: '{self}拿毒箭指着⟦sikong_xuan⟧，逼他交出了⟦duanchang_antidote⟧'}}
          fail:
            - {emit: {actor: self, verb: threaten, text: '{self}与⟦sikong_xuan⟧僵持了一阵，没能逼出解药'}}
  - id: mw_move_on
    text: 了结之后另寻去处
    do: {verb: wait}
    pre: {not: {status: [self, captive]}}
    takes: 96
